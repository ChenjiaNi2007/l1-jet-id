name: fast_jetclass

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pyyaml=6.*
  # TensorFlow 2.14 requires numpy>=1.23.5,<2.0.0 (numpy-2 support only landed in
  # TF 2.16+). Pinning numpy 2.1 here made pip's resolver backtrack forever trying to
  # reconcile it with tensorflow==2.14. 1.26.* is the latest numpy TF 2.14 accepts and
  # is compatible with scikit-learn 1.6 and matplotlib 3.10.
  - numpy=1.26.*
  - python-wget=3.2
  - scikit-learn=1.6.*
  - matplotlib=3.10.*
  - pip

  - pip:
    # GPU build: [and-cuda] pulls the nvidia-*-cu11 CUDA runtime wheels (~5GB download).
    # If `conda env create` dies mid-download (JupyterHub pod cull), don't recreate the
    # env — activate it and re-run `pip install 'tensorflow[and-cuda]==2.14'`; the pip
    # cache resumes. Runs fine on CPU-only machines too (wheels are just unused).
    - tensorflow[and-cuda]==2.14
    - tensorflow-model-optimization==0.8.0
    - qkeras==0.9
